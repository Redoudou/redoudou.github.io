name: Publish personal website

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Generate crawler metadata and text versions
        run: python3 scripts/build_discovery.py
      - name: Render the existing blog and reference archive
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Preserve standalone pages and the production domain
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          standalone=(index.html speaking-media.html projects.html ai-operations.html
            passport-for-tokenized-markets.html choosing-ethereum-privacy.html stage-light.css)
          cp "${standalone[@]}" CNAME _site/
          cp robots.txt llms.txt sitemap-main.xml profile.md *.html.md _site/
          for file in robots.txt llms.txt sitemap-main.xml profile.md *.html.md; do
            cmp "$file" "_site/$file"
          done
          touch _site/.nojekyll
          for page in "${standalone[@]}"; do
            cmp "$page" "_site/$page"
          done
          test "$(cat _site/CNAME)" = "helloredwan.me"
          test -f _site/aboutme/index.html
      - name: Upload production artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
